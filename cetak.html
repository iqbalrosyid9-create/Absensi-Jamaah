<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Kartu Santri - PPTQ Al Husna Lestari</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    @media print {
      /* Sembunyikan panel kontrol saat mencetak */
      .no-print {
        display: none !important;
      }
      body {
        background: white !important;
        color: black !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      @page {
        size: A4 portrait;
        margin: 1cm;
      }
      .card-item {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }

    /* Ukuran Standar Kartu ID */
    .id-card-size {
      width: 8.5cm;
      height: 5.4cm;
      box-sizing: border-box;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4">

  <!-- Kontrol Navigasi & Pilihan Santri (Tidak Ikut Tercetak) -->
  <div class="no-print max-w-4xl mx-auto space-y-4 mb-6">
    
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg flex flex-col md:flex-row items-center justify-between gap-3">
      <div>
        <h1 class="text-base font-bold text-white flex items-center gap-2">
          <span>🖨️</span> Cetak Kartu Presensi Santri
        </h1>
        <p class="text-xs text-slate-400">Pilih beberapa santri yang kehilangan kartu untuk dicetak sekaligus dalam kertas A4.</p>
      </div>
      <div class="flex items-center gap-2">
        <!-- Tombol Kembali Langsung Mengarah ke index.html -->
        <a href="./index.html" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 active:bg-slate-800 rounded-xl text-xs font-semibold text-slate-200 transition text-center inline-block">
          Kembali
        </a>
        <button id="btn-print-action" onclick="handlePrint()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-bold text-white shadow-lg flex items-center gap-1.5 transition">
          <span>🖨️</span> Cetak Sekarang (<span id="selected-count-badge">0</span>)
        </button>
      </div>
    </div>

    <!-- Filter & Pencarian -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-2">
        <input type="text" id="search-input" placeholder="🔍 Cari nama atau ID santri..." class="w-full sm:w-80 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
        
        <div class="flex items-center gap-2 w-full sm:w-auto justify-end text-xs">
          <button onclick="toggleSelectAll(true)" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-emerald-400 font-semibold rounded-lg">
            Pilih Semua
          </button>
          <button onclick="toggleSelectAll(false)" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold rounded-lg">
            Batal Pilih
          </button>
        </div>
      </div>

      <!-- Daftar Pilihan Santri (Checkbox) -->
      <div id="selection-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 max-h-60 overflow-y-auto pr-1"></div>
    </div>

  </div>

  <!-- Area Lembar Cetak Kartu (A4 Layout) -->
  <div id="print-sheet-container" class="max-w-[21cm] mx-auto bg-white text-slate-900 p-4 rounded-2xl shadow-2xl flex flex-wrap gap-3 justify-center items-center">
    <p id="empty-state-text" class="text-xs text-slate-500 py-12 text-center no-print">
      Centang satu atau beberapa santri di atas untuk melihat pratinjau kartu yang akan dicetak.
    </p>
  </div>

  <script>
    let jamaahData = JSON.parse(localStorage.getItem('absensi_jamaah_list')) || [];
    let selectedIds = new Set();

    function renderSelectionList() {
      const listContainer = document.getElementById('selection-list');
      const keyword = (document.getElementById('search-input').value || '').toLowerCase().trim();
      listContainer.innerHTML = '';

      let filtered = jamaahData;
      if (keyword) {
        filtered = jamaahData.filter(j => 
          j.name.toLowerCase().includes(keyword) || String(j.id).toLowerCase().includes(keyword)
        );
      }

      if (filtered.length === 0) {
        listContainer.innerHTML = '<p class="text-xs text-slate-400 py-4 col-span-full text-center">Tidak ada santri yang cocok.</p>';
        return;
      }

      filtered.forEach(j => {
        const isChecked = selectedIds.has(String(j.id));
        const div = document.createElement('label');
        div.className = `flex items-center gap-2.5 p-2 rounded-xl border text-xs cursor-pointer transition select-none ${isChecked ? 'bg-emerald-950/60 border-emerald-600 text-emerald-200' : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-600'}`;
        div.innerHTML = `
          <input type="checkbox" value="${j.id}" ${isChecked ? 'checked' : ''} onchange="toggleSelect('${j.id}')" class="rounded text-emerald-600 focus:ring-emerald-500 bg-slate-800 border-slate-700">
          <div class="min-w-0 flex-1">
            <p class="font-bold truncate text-[11px] leading-tight">${j.name}</p>
            <p class="text-[10px] text-slate-400 font-mono">${j.id} • ${j.category}</p>
          </div>
        `;
        listContainer.appendChild(div);
      });

      document.getElementById('selected-count-badge').textContent = selectedIds.size;
    }

    window.toggleSelect = function(id) {
      id = String(id);
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      renderSelectionList();
      renderPrintCards();
    };

    window.toggleSelectAll = function(select) {
      if (select) {
        jamaahData.forEach(j => selectedIds.add(String(j.id)));
      } else {
        selectedIds.clear();
      }
      renderSelectionList();
      renderPrintCards();
    };

    document.getElementById('search-input').addEventListener('input', renderSelectionList);

    function renderPrintCards() {
      const container = document.getElementById('print-sheet-container');
      container.innerHTML = '';

      if (selectedIds.size === 0) {
        container.innerHTML = `
          <p id="empty-state-text" class="text-xs text-slate-400 py-12 text-center no-print">
            Centang satu atau beberapa santri di atas untuk melihat pratinjau kartu yang akan dicetak.
          </p>
        `;
        return;
      }

      const selectedSantri = jamaahData.filter(j => selectedIds.has(String(j.id)));

      selectedSantri.forEach(santri => {
        const card = document.createElement('div');
        card.className = 'id-card-size card-item border-2 border-dashed border-slate-400 rounded-xl p-2.5 flex flex-col justify-between bg-white text-slate-900 shadow-sm relative';
        
        const qrId = 'qrcode-box-' + santri.id;
        
        card.innerHTML = `
          <!-- Header Kartu -->
          <div class="flex items-center justify-between border-b border-slate-200 pb-1.5">
            <div class="flex items-center gap-1.5">
              <span class="text-sm">🕌</span>
              <span class="text-[9px] font-black tracking-wider text-emerald-800 uppercase">KARTU PRESENSI SHOLAT</span>
            </div>
            <span class="text-[8px] font-bold bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded">${santri.category}</span>
          </div>

          <!-- Body: QR & Biodata -->
          <div class="flex items-center gap-2.5 my-auto">
            <div id="${qrId}" class="p-1 bg-white border border-slate-200 rounded-lg shrink-0"></div>
            <div class="min-w-0 flex-1 space-y-0.5">
              <h3 class="text-xs font-black leading-tight text-slate-900 truncate">${santri.name}</h3>
              <p class="text-[11px] font-mono font-bold text-emerald-700 leading-none">ID: ${santri.id}</p>
              <p class="text-[7.5px] text-slate-500 leading-snug pt-1">Pindai barcode ini pada kamera petugas presensi sebelum sholat.</p>
            </div>
          </div>

          <!-- Footer Kartu -->
          <div class="border-t border-slate-200 pt-1 flex items-center justify-between text-[7px] text-slate-400">
            <span class="font-semibold text-emerald-900">PPTQ Al Husna Lestari</span>
            <span class="font-mono">${santri.id}</span>
          </div>
        `;

        container.appendChild(card);

        setTimeout(() => {
          new QRCode(document.getElementById(qrId), {
            text: String(santri.id),
            width: 70,
            height: 70,
            colorDark: "#047857",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
          });
        }, 10);
      });
    }

    window.handlePrint = function() {
      if (selectedIds.size === 0) {
        return alert('Silakan centang minimal satu santri yang ingin dicetak kartunya.');
      }
      window.print();
    };

    renderSelectionList();
    renderPrintCards();
  </script>
</body>
</html>
