<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Kartu QR Jamaah - Kertas A4</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* Ukuran Standar Kartu: Rasio Kartu ID Card (sekitar 8.5 cm x 5.4 cm) */
    .card-print {
      width: 8.5cm;
      height: 5.4cm;
      page-break-inside: avoid;
    }

    /* Pengaturan Khusus Halaman Cetak Kertas A4 */
    @media print {
      body {
        background: white !important;
        color: black !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .page-sheet {
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        padding: 0.8cm !important;
        width: 100% !important;
      }
      .card-print {
        border: 1px dashed #94a3b8 !important; /* Garis panduan potong gunting */
      }
      @page {
        size: A4 portrait;
        margin: 0.5cm;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4">

  <!-- Header Navigasi & Kontrol (Tidak Ikut Tercetak) -->
  <header class="no-print max-w-4xl mx-auto mb-6 bg-slate-800 border border-slate-700 p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3 shadow-lg">
    <div>
      <h1 class="text-base font-bold text-white flex items-center gap-2">
        <span>🖨️</span> Cetak Kartu QR Presensi
      </h1>
      <p class="text-xs text-slate-400">Layout Kertas A4 (Muat 8–10 Kartu per Lembar siap potong)</p>
    </div>
    
    <div class="flex items-center gap-2">
      <a href="./index.html" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-semibold text-slate-200 transition">
        ⬅️ Kembali ke App
      </a>
      <button onclick="window.print()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-bold text-white shadow transition flex items-center gap-1.5">
        🖨️ Cetak / Simpan PDF
      </button>
    </div>
  </header>

  <!-- Area Lembar Cetak -->
  <main class="page-sheet max-w-4xl mx-auto bg-white rounded-2xl p-6 shadow-2xl text-slate-900 min-h-[600px]">
    
    <!-- Status Loading -->
    <div id="loading-state" class="text-center py-16 text-slate-500 space-y-2">
      <div class="inline-block animate-spin text-3xl">⏳</div>
      <p class="text-sm font-medium">Mengambil database jamaah dari Google Sheets...</p>
    </div>

    <!-- Wadah Grid Kartu A4 (2 Kolom) -->
    <div id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 justify-items-center"></div>

  </main>

  <script>
    // URL Google Apps Script yang sama
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyszfOTv1q99BRO8skYi5ueiN16wmogFbTZEYjop4nIMGOGi_AtXfngea_ojoNjwBTU/exec";

    window.handleCloudMaster = function(res) {
      document.getElementById('loading-state').classList.add('hidden');
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      if (!res || !Array.isArray(res.jamaah) || res.jamaah.length === 0) {
        container.innerHTML = '<p class="col-span-2 text-center py-8 text-rose-500 text-sm font-semibold">Tidak ada data di tab Database Jamaah.</p>';
        return;
      }

      res.jamaah.forEach((person, index) => {
        // Kartu Elemen
        const card = document.createElement('div');
        card.className = 'card-print bg-white border border-slate-300 rounded-xl p-3 flex flex-col justify-between relative shadow-sm overflow-hidden';
        
        const qrId = 'qr-item-' + index;

        card.innerHTML = `
          <!-- Header Kartu -->
          <div class="flex items-center justify-between border-b border-emerald-800/20 pb-1.5">
            <div class="flex items-center gap-1.5">
              <span class="text-base">🕌</span>
              <span class="text-[11px] font-black tracking-tight text-emerald-800 uppercase">KARTU PRESENSI SHOLAT</span>
            </div>
            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-200">${person.category}</span>
          </div>

          <!-- Bagian Isi (QR Code + Detail Nama) -->
          <div class="flex items-center gap-3 my-auto py-1">
            <div id="${qrId}" class="p-1 bg-white border border-slate-200 rounded-lg shrink-0 flex items-center justify-center"></div>
            
            <div class="flex-1 min-w-0">
              <p class="text-xs font-black text-slate-800 truncate leading-tight">${person.name}</p>
              <p class="text-[11px] font-mono font-bold text-emerald-700 mt-1">${person.id}</p>
              <p class="text-[8px] text-slate-400 mt-1.5 leading-tight">Tunjukkan barcode ini kepada petugas scanner saat memasuki masjid/mushola.</p>
            </div>
          </div>

          <!-- Footer Kartu -->
          <div class="border-t border-slate-100 pt-1 text-[8px] text-slate-400 flex justify-between items-center">
            <span>Pondok Pesantren Tahfidzul Qur'an Al Husna</span>
            <span class="font-mono">${person.id}</span>
          </div>
        `;

        container.appendChild(card);

        // Generate QR Code untuk masing-masing kartu
        new QRCode(document.getElementById(qrId), {
          text: person.id,
          width: 80,
          height: 80,
          colorDark: "#065f46",
          colorLight: "#ffffff"
        });
      });
    };

    // Ambil Data via JSONP
    function loadData() {
      const script = document.createElement('script');
      script.src = SCRIPT_URL + '?callback=handleCloudMaster&_t=' + Date.now();
      document.body.appendChild(script);
    }

    loadData();
  </script>
</body>
</html>
