<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#047857">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Absensi Sholat Jamaah</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    body {
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
    }
    #reader video {
      object-fit: cover !important;
      border-radius: 0.75rem;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-emerald-800 border-b border-emerald-700 sticky top-0 z-40 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center font-bold text-amber-300 shadow">
          🕌
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight">Presensi Jamaah</h1>
          <p id="live-clock" class="text-xs text-emerald-200">Memuat jam...</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button id="btn-sync-manual" class="px-2.5 py-1 text-xs rounded-lg bg-emerald-700 hover:bg-emerald-600 active:bg-emerald-900 text-white font-medium shadow flex items-center gap-1">
          🔄 Sync
        </button>
        <span id="current-prayer-badge" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-950 text-emerald-300 border border-emerald-600">
          Subuh
        </span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24 space-y-4">
    
    <!-- Tab 1: Scanner View -->
    <section id="tab-scan" class="space-y-4">
      <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 shadow-lg">
        <div class="flex items-center justify-between mb-3">
          <label class="text-xs font-semibold text-slate-400">PILIH SESI SHOLAT</label>
          <select id="prayer-select" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs font-medium text-emerald-400 focus:outline-none focus:ring-1 focus:ring-emerald-500">
            <option value="Subuh">Subuh</option>
            <option value="Dzuhur">Dzuhur</option>
            <option value="Ashar">Ashar</option>
            <option value="Maghrib">Maghrib</option>
            <option value="Isya">Isya</option>
          </select>
        </div>

        <div class="relative bg-slate-950 rounded-xl overflow-hidden min-h-[260px] flex items-center justify-center border border-slate-700">
          <div id="reader" class="w-full"></div>
          <div id="camera-placeholder" class="text-center p-6 space-y-2">
            <div class="text-4xl">📷</div>
            <p class="text-xs text-slate-400">Kamera dinonaktifkan</p>
          </div>
        </div>

        <div class="mt-3 grid grid-cols-2 gap-2">
          <button id="btn-start-camera" class="w-full py-2.5 px-3 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 rounded-xl text-xs font-semibold tracking-wide transition shadow">
            Mulai Kamera
          </button>
          <button id="btn-stop-camera" disabled class="w-full py-2.5 px-3 bg-slate-700 text-slate-400 rounded-xl text-xs font-semibold tracking-wide transition disabled:opacity-50">
            Matikan
          </button>
        </div>
      </div>

      <!-- Quick Manual Check-In -->
      <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
        <h2 class="text-xs font-semibold text-slate-400 mb-2">ABSENSI MANUAL / ID</h2>
        <div class="flex space-x-2">
          <input type="text" id="manual-id-input" placeholder="Ketik ID Jamaah (mis: JMH-001)" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500 text-slate-100">
          <button id="btn-manual-submit" class="bg-emerald-700 hover:bg-emerald-600 active:bg-emerald-800 px-4 py-2 rounded-xl text-xs font-semibold text-white">
            Absen
          </button>
        </div>
      </div>

      <!-- Live Scan Result Toast -->
      <div id="scan-feedback" class="hidden bg-slate-800 border-l-4 rounded-xl p-3 shadow-lg flex items-center space-x-3">
        <div id="feedback-icon" class="text-2xl">✅</div>
        <div class="flex-1">
          <h3 id="feedback-title" class="text-xs font-bold leading-tight">Presensi Berhasil</h3>
          <p id="feedback-msg" class="text-xs text-slate-400">Nama Jamaah (ID)</p>
        </div>
      </div>
    </section>

    <!-- Tab 2: Jamaah (Tersinkron Sheet2) -->
    <section id="tab-jamaah" class="hidden space-y-4">
      <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-sm font-bold text-slate-200">Database Jamaah</h2>
            <p class="text-[11px] text-slate-400">Tersinkron dari Google Sheets (Database Jamaah)</p>
          </div>
          <div class="flex items-center gap-2">
            <a href="./cetak.html" target="_blank" class="px-2.5 py-1 text-[11px] bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg shadow flex items-center gap-1 transition">
              🖨️ Cetak Kartu
            </a>
            <span id="jamaah-count" class="text-xs text-emerald-400 font-bold bg-slate-900 px-2 py-1 rounded-lg">0 Orang</span>
          </div>
        </div>
      </div>

      <!-- Preview Modal Card QR -->
      <div id="qr-preview-box" class="hidden bg-slate-800 rounded-2xl p-4 border border-emerald-600 text-center space-y-3">
        <h3 id="card-preview-name" class="font-bold text-sm text-emerald-400">Kartu Digital</h3>
        <p id="card-preview-role" class="text-xs text-slate-400">Kategori</p>
        <div id="qrcode-container" class="bg-white p-3 rounded-xl inline-block mx-auto shadow-inner"></div>
        <p id="card-preview-id" class="text-xs font-mono font-bold text-slate-300">ID: -</p>
        <div class="pt-2">
          <button id="btn-close-preview" class="text-xs text-slate-400 underline hover:text-slate-200">Tutup Preview</button>
        </div>
      </div>

      <!-- List Jamaah -->
      <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 space-y-3">
        <div id="jamaah-list" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
      </div>
    </section>

    <!-- Tab 3: Rekap & Cek Tidak Jamaah -->
    <section id="tab-rekap" class="hidden space-y-4">
      <!-- 3 Kartu Statistik -->
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-slate-800 border border-slate-700 p-2.5 rounded-2xl text-center">
          <span class="text-[11px] text-slate-400">Hadir</span>
          <p id="today-count" class="text-lg font-bold text-emerald-400 mt-0.5">0</p>
        </div>
        <div class="bg-slate-800 border border-slate-700 p-2.5 rounded-2xl text-center">
          <span class="text-[11px] text-slate-400">Belum Absen</span>
          <p id="absent-count" class="text-lg font-bold text-rose-400 mt-0.5">0</p>
        </div>
        <div class="bg-slate-800 border border-slate-700 p-2.5 rounded-2xl text-center">
          <span class="text-[11px] text-slate-400">Total Jamaah</span>
          <p id="total-registered-count" class="text-lg font-bold text-amber-300 mt-0.5">0</p>
        </div>
      </div>

      <!-- Tab Filter: Hadir vs Belum Hadir -->
      <div class="bg-slate-800 rounded-2xl p-3 border border-slate-700 space-y-3">
        <div class="flex items-center justify-between pb-2 border-b border-slate-700/60">
          <div class="flex space-x-1">
            <button id="filter-btn-absent" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-rose-600 text-white shadow">
              Belum Absen (<span id="badge-absent">0</span>)
            </button>
            <button id="filter-btn-present" class="px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-700 text-slate-300 hover:text-white">
              Sudah Absen
            </button>
          </div>
          
          <button id="btn-copy-absent" title="Salin daftar anak belum jamaah ke WA" class="text-[11px] bg-slate-700 hover:bg-slate-600 active:bg-slate-800 px-2.5 py-1 rounded-lg text-emerald-300 font-medium border border-slate-600 flex items-center gap-1">
            📋 Salin WA
          </button>
        </div>

        <!-- Wadah List Rekap -->
        <div id="rekap-display-list" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-800 z-40 max-w-md mx-auto">
    <div class="grid grid-cols-3 py-2 text-center text-xs">
      <button data-tab="tab-scan" class="nav-btn text-emerald-400 flex flex-col items-center space-y-1">
        <span class="text-lg">📷</span>
        <span>Scan</span>
      </button>
      <button data-tab="tab-jamaah" class="nav-btn text-slate-400 flex flex-col items-center space-y-1">
        <span class="text-lg">👥</span>
        <span>Jamaah</span>
      </button>
      <button data-tab="tab-rekap" class="nav-btn text-slate-400 flex flex-col items-center space-y-1">
        <span class="text-lg">📊</span>
        <span>Rekap</span>
      </button>
    </div>
  </nav>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyszfOTv1q99BRO8skYi5ueiN16wmogFbTZEYjop4nIMGOGi_AtXfngea_ojoNjwBTU/exec";
    let html5QrCode = null;
    let isScanning = false;
    let currentRekapFilter = 'absent'; // 'absent' atau 'present'

    let jamaahData = JSON.parse(localStorage.getItem('absensi_jamaah_list')) || [];
    let logsData = JSON.parse(localStorage.getItem('absensi_logs')) || [];

    function saveState() {
      localStorage.setItem('absensi_jamaah_list', JSON.stringify(jamaahData));
      localStorage.setItem('absensi_logs', JSON.stringify(logsData));
    }

    function parseDateNormalized(rawDate) {
      if (!rawDate) return '';
      const str = String(rawDate).trim();
      const matchIso = str.match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})/);
      if (matchIso) {
        return `${matchIso[1]}-${String(matchIso[2]).padStart(2, '0')}-${String(matchIso[3]).padStart(2, '0')}`;
      }
      const months = {
        Jan:'01', Feb:'02', Mar:'03', Apr:'04', May:'05', Jun:'06',
        Jul:'07', Aug:'08', Sep:'09', Oct:'10', Nov:'11', Dec:'12'
      };
      const matchGmt = str.match(/([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})/);
      if (matchGmt && months[matchGmt[1]]) {
        return `${matchGmt[3]}-${months[matchGmt[1]]}-${String(matchGmt[2]).padStart(2, '0')}`;
      }
      return str;
    }

    // --- SINKRONISASI MASTER GOOGLE SHEETS (JSONP BEBAS CORS) ---
    window.handleCloudMaster = function(res) {
      if (res && res.status === 'success') {
        if (Array.isArray(res.jamaah) && res.jamaah.length > 0) {
          jamaahData = res.jamaah;
        }
        if (Array.isArray(res.logs)) {
          logsData = res.logs;
        }
        saveState();
        renderJamaahList();
        renderRekapView();
        console.log('Sinkron master berhasil: ' + jamaahData.length + ' jamaah, ' + logsData.length + ' log');
      }
    };

    function syncFromCloud() {
      if (!SCRIPT_URL) return;
      const oldScript = document.getElementById('jsonp-sync-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-sync-script';
      script.src = SCRIPT_URL + '?callback=handleCloudMaster&_t=' + Date.now();
      document.body.appendChild(script);
    }

    syncFromCloud();
    setInterval(syncFromCloud, 10000);

    document.getElementById('btn-sync-manual').addEventListener('click', () => {
      syncFromCloud();
      showFeedback(true, 'Sinkronisasi', 'Menghubungkan ke Google Sheets...');
    });

    // Audio & Haptic
    function playBeep(success = true) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(success ? 880 : 320, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + (success ? 0.12 : 0.25));
      } catch (e) {}
    }

    function triggerHaptic(type = 'success') {
      if ('vibrate' in navigator) {
        navigator.vibrate(type === 'success' ? [80, 50, 80] : 250);
      }
    }

    function getEstimatedPrayer() {
      const now = new Date();
      const totalMinutes = now.getHours() * 60 + now.getMinutes();
      if (totalMinutes >= 270 && totalMinutes < 390) return "Subuh";
      if (totalMinutes >= 705 && totalMinutes < 870) return "Dzuhur";
      if (totalMinutes >= 900 && totalMinutes < 1050) return "Ashar";
      if (totalMinutes >= 1065 && totalMinutes < 1140) return "Maghrib";
      if (totalMinutes >= 1140 || totalMinutes < 240) return "Isya";
      return "Dzuhur";
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent = now.toLocaleTimeString('id-ID') + ' WIB';
      const curPrayer = getEstimatedPrayer();
      document.getElementById('current-prayer-badge').textContent = curPrayer;
      if (!window.userChangedPrayer) {
        document.getElementById('prayer-select').value = curPrayer;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    document.getElementById('prayer-select').addEventListener('change', () => {
      window.userChangedPrayer = true;
      renderRekapView(); // Perbarui perhitungan saat sesi sholat diganti
    });

    // --- PROSES ABSENSI ---
    function processAttendance(jamaahId) {
      const cleanId = (jamaahId || '').trim();
      if (!cleanId) return;

      const prayer = document.getElementById('prayer-select').value;
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      const person = jamaahData.find(j => j.id.toLowerCase() === cleanId.toLowerCase());
      if (!person) {
        showFeedback(false, 'Tidak Ditemukan', `ID: ${cleanId} tidak ada di Database.`);
        playBeep(false);
        triggerHaptic('error');
        return;
      }

      const alreadyCheckedIn = logsData.some(log => 
        log.jamaahId === person.id && 
        parseDateNormalized(log.date) === todayStr && 
        log.prayer === prayer
      );

      if (alreadyCheckedIn) {
        showFeedback(false, 'Sudah Absen', `${person.name} sudah absen sholat ${prayer}.`);
        playBeep(false);
        triggerHaptic('error');
        return;
      }

      const newRecord = {
        id: 'LOG-' + Date.now(),
        jamaahId: person.id,
        name: person.name,
        category: person.category,
        prayer: prayer,
        date: todayStr,
        time: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        status: 'Tepat Waktu'
      };

      logsData.unshift(newRecord);
      saveState();
      renderRekapView();

      if (SCRIPT_URL) {
        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newRecord)
        }).then(() => {
          setTimeout(syncFromCloud, 1000);
        }).catch(err => console.error('Gagal kirim:', err));
      }
      
      showFeedback(true, 'Presensi Masuk', `${person.name} (${prayer})`);
      playBeep(true);
      triggerHaptic('success');
    }

    function showFeedback(success, title, msg) {
      const box = document.getElementById('scan-feedback');
      const icon = document.getElementById('feedback-icon');
      const titleEl = document.getElementById('feedback-title');
      const msgEl = document.getElementById('feedback-msg');

      box.classList.remove('hidden', 'border-emerald-500', 'border-rose-500', 'bg-emerald-950/40', 'bg-rose-950/40');
      if (success) {
        box.classList.add('border-emerald-500', 'bg-emerald-950/40');
        icon.textContent = '✅';
        titleEl.className = 'text-xs font-bold text-emerald-400';
      } else {
        box.classList.add('border-rose-500', 'bg-rose-950/40');
        icon.textContent = '⚠️';
        titleEl.className = 'text-xs font-bold text-rose-400';
      }

      titleEl.textContent = title;
      msgEl.textContent = msg;

      clearTimeout(window.feedbackTimer);
      window.feedbackTimer = setTimeout(() => box.classList.add('hidden'), 4000);
    }

    // Kamera
    const btnStart = document.getElementById('btn-start-camera');
    const btnStop = document.getElementById('btn-stop-camera');
    const cameraPlaceholder = document.getElementById('camera-placeholder');

    btnStart.addEventListener('click', async () => {
      try {
        html5QrCode = new Html5Qrcode("reader");
        cameraPlaceholder.classList.add('hidden');
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 },
          (decodedText) => {
            html5QrCode.pause(true);
            processAttendance(decodedText);
            setTimeout(() => {
              if (html5QrCode && isScanning) html5QrCode.resume();
            }, 2000);
          },
          () => {}
        );
        isScanning = true;
        btnStart.disabled = true;
        btnStart.classList.add('opacity-50');
        btnStop.disabled = false;
        btnStop.classList.remove('opacity-50');
      } catch (err) {
        alert("Gagal membuka kamera. Pastikan izin kamera telah diberikan.");
        cameraPlaceholder.classList.remove('hidden');
      }
    });

    btnStop.addEventListener('click', async () => {
      if (html5QrCode && isScanning) {
        await html5QrCode.stop();
        html5QrCode.clear();
        isScanning = false;
        btnStart.disabled = false;
        btnStart.classList.remove('opacity-50');
        btnStop.disabled = true;
        btnStop.classList.add('opacity-50');
        cameraPlaceholder.classList.remove('hidden');
      }
    });

    document.getElementById('btn-manual-submit').addEventListener('click', () => {
      const input = document.getElementById('manual-id-input');
      processAttendance(input.value);
      input.value = '';
    });

    // Navigasi Tab
    const navBtns = document.querySelectorAll('.nav-btn');
    const tabs = {
      'tab-scan': document.getElementById('tab-scan'),
      'tab-jamaah': document.getElementById('tab-jamaah'),
      'tab-rekap': document.getElementById('tab-rekap')
    };

    navBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.tab;
        Object.keys(tabs).forEach(k => tabs[k].classList.add('hidden'));
        tabs[target].classList.remove('hidden');

        navBtns.forEach(b => {
          b.classList.remove('text-emerald-400');
          b.classList.add('text-slate-400');
        });
        btn.classList.add('text-emerald-400');
        btn.classList.remove('text-slate-400');

        if (target === 'tab-jamaah') renderJamaahList();
        if (target === 'tab-rekap') {
          syncFromCloud();
          renderRekapView();
        }
      });
    });

    function showQrCard(id, name, category) {
      const box = document.getElementById('qr-preview-box');
      const container = document.getElementById('qrcode-container');
      container.innerHTML = '';
      new QRCode(container, {
        text: id,
        width: 160,
        height: 160,
        colorDark: "#047857",
        colorLight: "#ffffff"
      });
      document.getElementById('card-preview-name').textContent = name;
      document.getElementById('card-preview-role').textContent = category;
      document.getElementById('card-preview-id').textContent = 'ID: ' + id;
      box.classList.remove('hidden');
    }

    document.getElementById('btn-close-preview').addEventListener('click', () => {
      document.getElementById('qr-preview-box').classList.add('hidden');
    });

    function renderJamaahList() {
      const container = document.getElementById('jamaah-list');
      document.getElementById('jamaah-count').textContent = jamaahData.length + ' Orang';
      container.innerHTML = '';

      if (jamaahData.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 py-4 text-center">Sedang memuat data dari Database Jamaah...</p>';
        return;
      }

      jamaahData.forEach(j => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between p-2.5 bg-slate-900 rounded-xl border border-slate-700/60 text-xs';
        div.innerHTML = `
          <div>
            <p class="font-bold text-slate-200">${j.name}</p>
            <p class="text-slate-400 font-mono text-[11px]">${j.id} • ${j.category}</p>
          </div>
          <button onclick="showQrCard('${j.id}', '${j.name}', '${j.category}')" class="px-2 py-1 bg-emerald-950 text-emerald-400 border border-emerald-700 rounded-lg text-[11px]">
            QR
          </button>
        `;
        container.appendChild(div);
      });
    }

    // --- LOGIKA MENDETEKSI ANAK YANG BELUM ABSEN (GHAIB) ---
    function getAttendanceAnalysis() {
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const prayer = document.getElementById('prayer-select').value;

      // 1. Data kehadiran hari ini pada sesi sholat terpilih
      const presentLogs = logsData.filter(l => 
        parseDateNormalized(l.date) === todayStr && 
        l.prayer === prayer
      );

      // Kumpulan ID jamaah yang sudah absen
      const presentIds = new Set(presentLogs.map(l => l.jamaahId.toLowerCase()));

      // 2. Jamaah yang BELUM absen (ada di Database tapi tidak ada di logs)
      const absentList = jamaahData.filter(j => !presentIds.has(j.id.toLowerCase()));

      return {
        todayStr,
        prayer,
        presentLogs,
        absentList,
        totalRegistered: jamaahData.length
      };
    }

    function renderRekapView() {
      const { prayer, presentLogs, absentList, totalRegistered } = getAttendanceAnalysis();

      // Update angka ringkasan
      document.getElementById('today-count').textContent = presentLogs.length;
      document.getElementById('absent-count').textContent = absentList.length;
      document.getElementById('badge-absent').textContent = absentList.length;
      document.getElementById('total-registered-count').textContent = totalRegistered;

      const container = document.getElementById('rekap-display-list');
      container.innerHTML = '';

      if (currentRekapFilter === 'absent') {
        if (absentList.length === 0) {
          container.innerHTML = `
            <div class="text-center py-6 space-y-1">
              <p class="text-2xl">🎉</p>
              <p class="text-xs text-emerald-400 font-semibold">Alhamdulillah, semua jamaah sudah absen sholat ${prayer}!</p>
            </div>
          `;
          return;
        }

        absentList.forEach((j, index) => {
          const div = document.createElement('div');
          div.className = 'flex items-center justify-between p-2.5 bg-slate-900 rounded-xl border border-rose-900/40 text-xs';
          div.innerHTML = `
            <div>
              <p class="font-bold text-rose-300">${index + 1}. ${j.name}</p>
              <p class="text-slate-400 font-mono text-[11px]">${j.id} • ${j.category}</p>
            </div>
            <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-rose-950 text-rose-300 border border-rose-800">
              Belum Hadir
            </span>
          `;
          container.appendChild(div);
        });

      } else {
        // Tampilkan yang SUDAH ABSEN
        if (presentLogs.length === 0) {
          container.innerHTML = `<p class="text-xs text-slate-500 py-4 text-center">Belum ada jamaah yang absen pada sholat ${prayer}.</p>`;
          return;
        }

        presentLogs.forEach((log, index) => {
          const div = document.createElement('div');
          div.className = 'flex items-center justify-between p-2.5 bg-slate-900 rounded-xl border border-slate-700/60 text-xs';
          div.innerHTML = `
            <div>
              <p class="font-bold text-slate-200">${index + 1}. ${log.name}</p>
              <p class="text-slate-400 text-[11px]">${log.prayer} • ${log.time}</p>
            </div>
            <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-950 text-emerald-300 border border-emerald-700">
              ${log.status}
            </span>
          `;
          container.appendChild(div);
        });
      }
    }

    // Filter tombol Hadir vs Belum Hadir
    const btnFilterAbsent = document.getElementById('filter-btn-absent');
    const btnFilterPresent = document.getElementById('filter-btn-present');

    btnFilterAbsent.addEventListener('click', () => {
      currentRekapFilter = 'absent';
      btnFilterAbsent.className = 'px-2.5 py-1 text-xs font-semibold rounded-lg bg-rose-600 text-white shadow';
      btnFilterPresent.className = 'px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-700 text-slate-300 hover:text-white';
      renderRekapView();
    });

    btnFilterPresent.addEventListener('click', () => {
      currentRekapFilter = 'present';
      btnFilterPresent.className = 'px-2.5 py-1 text-xs font-semibold rounded-lg bg-emerald-600 text-white shadow';
      btnFilterAbsent.className = 'px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-700 text-slate-300 hover:text-white';
      renderRekapView();
    });

    // Salin daftar anak belum jamaah ke format WhatsApp
    document.getElementById('btn-copy-absent').addEventListener('click', () => {
      const { prayer, todayStr, absentList } = getAttendanceAnalysis();
      if (absentList.length === 0) {
        alert('Semua santri/jamaah sudah hadir.');
        return;
      }

      let text = `*DAFTAR SANTRI BELUM SHOLAT*\n`;
      text += `📅 Tanggal: ${todayStr}\n`;
      text += `🕌 Sholat: ${prayer}\n`;
      text += `⚠️ Jumlah: ${absentList.length} orang\n\n`;
      absentList.forEach((j, i) => {
        text += `${i + 1}. ${j.name} (${j.category})\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showFeedback(true, 'Disalin', 'Daftar nama berhasil disalin. Siap ditempel ke WA!');
      }).catch(() => {
        alert('Gagal menyalin otomatis. Silakan salin manual.');
      });
    });

    renderJamaahList();
    renderRekapView();
  </script>
</body>
</html>
