<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#047857">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Absensi Sholat Jamaah</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    body {
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
    }
    #reader video {
      object-fit: cover !important;
      border-radius: 0.75rem;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Top Navigation / Header -->
  <header class="bg-emerald-800 border-b border-emerald-700 sticky top-0 z-40 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center font-bold text-amber-300 shadow">
          🕌
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight">Presensi Jamaah</h1>
          <p id="live-clock" class="text-xs text-emerald-200">Memuat jam...</p>
        </div>
      </div>
      <div class="text-right">
        <span id="current-prayer-badge" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-950 text-emerald-300 border border-emerald-600">
          Subuh
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24 space-y-4">
    
    <!-- Tab 1: Scanner View -->
    <section id="tab-scan" class="space-y-4">
      <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 shadow-lg">
        <div class="flex items-center justify-between mb-3">
          <label class="text-xs font-semibold text-slate-400">PILIH SESI SHOLAT</label>
          <select id="prayer-select" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs font-medium text-emerald-400 focus:outline-none focus:ring-1 focus:ring-emerald-500">
            <option value="Subuh">Subuh</option>
            <option value="Dzuhur">Dzuhur</option>
            <option value="Ashar">Ashar</option>
            <option value="Maghrib">Maghrib</option>
            <option value="Isya">Isya</option>
          </select>
        </div>

        <!-- Camera Area -->
        <div class="relative bg-slate-950 rounded-xl overflow-hidden min-h-[260px] flex items-center justify-center border border-slate-700">
          <div id="reader" class="w-full"></div>
          <div id="camera-placeholder" class="text-center p-6 space-y-2">
            <div class="text-4xl">📷</div>
            <p class="text-xs text-slate-400">Kamera dinonaktifkan</p>
          </div>
        </div>

        <div class="mt-3 grid grid-cols-2 gap-2">
          <button id="btn-start-camera" class="w-full py-2.5 px-3 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 rounded-xl text-xs font-semibold tracking-wide transition shadow">
            Mulai Kamera
          </button>
          <button id="btn-stop-camera" disabled class="w-full py-2.5 px-3 bg-slate-700 text-slate-400 rounded-xl text-xs font-semibold tracking-wide transition disabled:opacity-50">
            Matikan
          </button>
        </div>
      </div>

      <!-- Quick Manual Check-In -->
      <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
        <h2 class="text-xs font-semibold text-slate-400 mb-2">ABSENSI MANUAL / ID</h2>
        <div class="flex space-x-2">
          <input type="text" id="manual-id-input" placeholder="Ketik ID Jamaah (mis: JMH-001)" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500 text-slate-100">
          <button id="btn-manual-submit" class="bg-emerald-700 hover:bg-emerald-600 active:bg-emerald-800 px-4 py-2 rounded-xl text-xs font-semibold text-white">
            Absen
          </button>
        </div>
      </div>

      <!-- Live Scan Result Toast -->
      <div id="scan-feedback" class="hidden bg-slate-800 border-l-4 rounded-xl p-3 shadow-lg flex items-center space-x-3">
        <div id="feedback-icon" class="text-2xl">✅</div>
        <div class="flex-1">
          <h3 id="feedback-title" class="text-xs font-bold leading-tight">Presensi Berhasil</h3>
          <p id="feedback-msg" class="text-xs text-slate-400">Nama Jamaah (ID)</p>
        </div>
      </div>
    </section>

    <!-- Tab 2: Jamaah & QR Generator -->
    <section id="tab-jamaah" class="hidden space-y-4">
      <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 space-y-3">
        <h2 class="text-sm font-bold text-slate-200">Pendaftaran Kartu Jamaah</h2>
        <div class="space-y-2">
          <input type="text" id="form-name" placeholder="Nama Lengkap" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
          <input type="text" id="form-id" placeholder="ID Unik (Auto)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
          <select id="form-category" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none">
            <option value="Santri">Santri</option>
            <option value="Jamaah Umum">Jamaah Umum</option>
            <option value="Pengurus">Pengurus / Ustadz</option>
          </select>
          <button id="btn-save-jamaah" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-semibold text-white transition">
            Simpan & Buat Kartu QR
          </button>
        </div>
      </div>

      <!-- Preview Modal Card QR -->
      <div id="qr-preview-box" class="hidden bg-slate-800 rounded-2xl p-4 border border-emerald-600 text-center space-y-3">
        <h3 id="card-preview-name" class="font-bold text-sm text-emerald-400">Kartu Digital</h3>
        <p id="card-preview-role" class="text-xs text-slate-400">Kategori</p>
        <div id="qrcode-container" class="bg-white p-3 rounded-xl inline-block mx-auto shadow-inner"></div>
        <p id="card-preview-id" class="text-xs font-mono font-bold text-slate-300">ID: -</p>
        <div class="pt-2">
          <button id="btn-close-preview" class="text-xs text-slate-400 underline hover:text-slate-200">Tutup Preview</button>
        </div>
      </div>

      <!-- Daftar Jamaah Terdaftar -->
      <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-semibold text-slate-400">DAFTAR JAMAAH</h2>
          <span id="jamaah-count" class="text-xs text-emerald-400 font-bold">0 Orang</span>
        </div>
        <div id="jamaah-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
      </div>
    </section>

    <!-- Tab 3: Riwayat & Rekap -->
    <section id="tab-rekap" class="hidden space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-800 border border-slate-700 p-3 rounded-2xl text-center">
          <span class="text-xs text-slate-400">Total Hari Ini</span>
          <p id="today-count" class="text-xl font-bold text-emerald-400 mt-0.5">0</p>
        </div>
        <div class="bg-slate-800 border border-slate-700 p-3 rounded-2xl text-center">
          <span class="text-xs text-slate-400">Tepat Waktu</span>
          <p id="ontime-count" class="text-xl font-bold text-amber-300 mt-0.5">0</p>
        </div>
      </div>

      <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-semibold text-slate-400">LOG PRESENSI</h2>
          <button id="btn-export-csv" class="text-xs bg-emerald-700 hover:bg-emerald-600 px-2.5 py-1 rounded-lg text-white font-medium">
            Export CSV
          </button>
        </div>
        <div id="log-list" class="space-y-2 max-h-72 overflow-y-auto pr-1"></div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-800 z-40 max-w-md mx-auto">
    <div class="grid grid-cols-3 py-2 text-center text-xs">
      <button data-tab="tab-scan" class="nav-btn text-emerald-400 flex flex-col items-center space-y-1">
        <span class="text-lg">📷</span>
        <span>Scan</span>
      </button>
      <button data-tab="tab-jamaah" class="nav-btn text-slate-400 flex flex-col items-center space-y-1">
        <span class="text-lg">👥</span>
        <span>Jamaah</span>
      </button>
      <button data-tab="tab-rekap" class="nav-btn text-slate-400 flex flex-col items-center space-y-1">
        <span class="text-lg">📊</span>
        <span>Rekap</span>
      </button>
    </div>
  </nav>

  <script>
    // --- PWA Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Service Worker terpasang.'))
          .catch(err => console.error('PWA SW gagal:', err));
      });
    }

    // --- State & Google Apps Script Setup ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyszfOTv1q99BRO8skYi5ueiN16wmogFbTZEYjop4nIMGOGi_AtXfngea_ojoNjwBTU/exec";
    let html5QrCode = null;
    let isScanning = false;

    const initialJamaah = [
      { id: "JMH-001", name: "Ahmad Zaki", category: "Santri" },
      { id: "JMH-002", name: "Muhammad Rizky", category: "Santri" },
      { id: "JMH-003", name: "Pak Subandi", category: "Jamaah Umum" }
    ];

    let jamaahData = JSON.parse(localStorage.getItem('absensi_jamaah_list')) || initialJamaah;
    let logsData = JSON.parse(localStorage.getItem('absensi_logs')) || [];

    function saveState() {
      localStorage.setItem('absensi_jamaah_list', JSON.stringify(jamaahData));
      localStorage.setItem('absensi_logs', JSON.stringify(logsData));
    }

    // --- Sinkronisasi Cloud Dua Arah ---
    async function syncFromCloud() {
      if (!SCRIPT_URL) return;
      try {
        const res = await fetch(SCRIPT_URL);
        const result = await res.json();
        if (result.status === 'success' && Array.isArray(result.data)) {
          logsData = result.data;
          localStorage.setItem('absensi_logs', JSON.stringify(logsData));
          renderLogs();
          renderStats();
          console.log('Sinkronisasi cloud berhasil: ' + logsData.length + ' data masuk.');
        }
      } catch (err) {
        console.warn('Gagal sinkron data cloud, memakai offline storage:', err);
      }
    }

    syncFromCloud();
    setInterval(syncFromCloud, 15000);

    // --- Audio Feedback ---
    function playBeep(success = true) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (success) {
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.12);
        } else {
          osc.frequency.setValueAtTime(320, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        }
      } catch (e) {
        console.warn('Audio Context tidak diizinkan sebelum interaksi user');
      }
    }

    // --- Mobile Haptic Feedback ---
    function triggerHaptic(type = 'success') {
      if ('vibrate' in navigator) {
        if (type === 'success') {
          navigator.vibrate([80, 50, 80]);
        } else {
          navigator.vibrate(250);
        }
      }
    }

    // --- Perhitungan Waktu Sholat Otomatis ---
    function getEstimatedPrayer() {
      const now = new Date();
      const hour = now.getHours();
      const minute = now.getMinutes();
      const totalMinutes = hour * 60 + minute;

      if (totalMinutes >= 270 && totalMinutes < 390) return "Subuh";     // 04:30 - 06:30
      if (totalMinutes >= 705 && totalMinutes < 870) return "Dzuhur";    // 11:45 - 14:30
      if (totalMinutes >= 900 && totalMinutes < 1050) return "Ashar";    // 15:00 - 17:30
      if (totalMinutes >= 1065 && totalMinutes < 1140) return "Maghrib"; // 17:45 - 19:00
      if (totalMinutes >= 1140 || totalMinutes < 240) return "Isya";     // 19:00 - 04:00
      return "Dzuhur";
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent = now.toLocaleTimeString('id-ID') + ' WIB';
      
      const currentPrayer = getEstimatedPrayer();
      document.getElementById('current-prayer-badge').textContent = currentPrayer;
      
      if (!window.userChangedPrayer) {
        document.getElementById('prayer-select').value = currentPrayer;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    document.getElementById('prayer-select').addEventListener('change', () => {
      window.userChangedPrayer = true;
    });

    // --- Pemrosesan Presensi ---
    function processAttendance(jamaahId) {
      const cleanId = (jamaahId || '').trim();
      if (!cleanId) return;

      const prayer = document.getElementById('prayer-select').value;
      const todayStr = new Date().toISOString().split('T')[0];

      const person = jamaahData.find(j => j.id.toLowerCase() === cleanId.toLowerCase());
      if (!person) {
        showFeedback(false, 'Tidak Ditemukan', `ID: ${cleanId} belum terdaftar.`);
        playBeep(false);
        triggerHaptic('error');
        return;
      }

      const alreadyCheckedIn = logsData.some(log => 
        log.jamaahId === person.id && 
        log.date === todayStr && 
        log.prayer === prayer
      );

      if (alreadyCheckedIn) {
        showFeedback(false, 'Sudah Absen', `${person.name} sudah tercatat pada sholat ${prayer}.`);
        playBeep(false);
        triggerHaptic('error');
        return;
      }

      const now = new Date();
      const newRecord = {
        id: 'LOG-' + Date.now(),
        jamaahId: person.id,
        name: person.name,
        category: person.category,
        prayer: prayer,
        date: todayStr,
        time: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        status: 'Tepat Waktu'
      };

      logsData.unshift(newRecord);
      saveState();

      if (SCRIPT_URL) {
        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(newRecord)
        }).then(() => {
          console.log('Presensi berhasil dikirim ke Google Sheets');
        }).catch(err => {
          console.error('Gagal sinkron cloud:', err);
        });
      }
      
      showFeedback(true, 'Presensi Masuk', `${person.name} (${prayer})`);
      playBeep(true);
      triggerHaptic('success');

      renderLogs();
      renderStats();
    }

    function showFeedback(success, title, msg) {
      const box = document.getElementById('scan-feedback');
      const icon = document.getElementById('feedback-icon');
      const titleEl = document.getElementById('feedback-title');
      const msgEl = document.getElementById('feedback-msg');

      box.classList.remove('hidden', 'border-emerald-500', 'border-rose-500', 'bg-emerald-950/40', 'bg-rose-950/40');
      if (success) {
        box.classList.add('border-emerald-500', 'bg-emerald-950/40');
        icon.textContent = '✅';
        titleEl.className = 'text-xs font-bold text-emerald-400';
      } else {
        box.classList.add('border-rose-500', 'bg-rose-950/40');
        icon.textContent = '⚠️';
        titleEl.className = 'text-xs font-bold text-rose-400';
      }

      titleEl.textContent = title;
      msgEl.textContent = msg;

      clearTimeout(window.feedbackTimer);
      window.feedbackTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 4000);
    }

    // --- Scanner Kamera ---
    const btnStart = document.getElementById('btn-start-camera');
    const btnStop = document.getElementById('btn-stop-camera');
    const cameraPlaceholder = document.getElementById('camera-placeholder');

    btnStart.addEventListener('click', async () => {
      try {
        html5QrCode = new Html5Qrcode("reader");
        cameraPlaceholder.classList.add('hidden');
        
        await html5QrCode.start(
          { facingMode: "environment" },
          {
            fps: 15,
            qrbox: { width: 220, height: 220 },
            aspectRatio: 1.0
          },
          (decodedText) => {
            html5QrCode.pause(true);
            processAttendance(decodedText);
            setTimeout(() => {
              if (html5QrCode && isScanning) html5QrCode.resume();
            }, 2000);
          },
          () => {}
        );

        isScanning = true;
        btnStart.disabled = true;
        btnStart.classList.add('opacity-50');
        btnStop.disabled = false;
        btnStop.classList.remove('opacity-50');
      } catch (err) {
        alert("Gagal mengakses kamera. Pastikan izin kamera aktif pada browser.");
        cameraPlaceholder.classList.remove('hidden');
      }
    });

    btnStop.addEventListener('click', async () => {
      if (html5QrCode && isScanning) {
        await html5QrCode.stop();
        html5QrCode.clear();
        isScanning = false;
        btnStart.disabled = false;
        btnStart.classList.remove('opacity-50');
        btnStop.disabled = true;
        btnStop.classList.add('opacity-50');
        cameraPlaceholder.classList.remove('hidden');
      }
    });

    // --- Manual Input ---
    document.getElementById('btn-manual-submit').addEventListener('click', () => {
      const input = document.getElementById('manual-id-input');
      processAttendance(input.value);
      input.value = '';
    });

    // --- Navigasi Tab ---
    const navBtns = document.querySelectorAll('.nav-btn');
    const tabs = {
      'tab-scan': document.getElementById('tab-scan'),
      'tab-jamaah': document.getElementById('tab-jamaah'),
      'tab-rekap': document.getElementById('tab-rekap')
    };

    navBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.tab;
        
        Object.keys(tabs).forEach(k => {
          tabs[k].classList.add('hidden');
        });
        tabs[target].classList.remove('hidden');

        navBtns.forEach(b => {
          b.classList.remove('text-emerald-400');
          b.classList.add('text-slate-400');
        });
        btn.classList.add('text-emerald-400');
        btn.classList.remove('text-slate-400');

        if (target === 'tab-jamaah') renderJamaahList();
        if (target === 'tab-rekap') {
          renderLogs();
          renderStats();
        }
      });
    });

    // --- Form Jamaah & QR Generator ---
    document.getElementById('btn-save-jamaah').addEventListener('click', () => {
      const name = document.getElementById('form-name').value.trim();
      let id = document.getElementById('form-id').value.trim();
      const category = document.getElementById('form-category').value;

      if (!name) {
        alert('Nama harus diisi!');
        return;
      }
      if (!id) {
        id = 'JMH-' + Math.floor(100 + Math.random() * 900);
      }

      jamaahData.push({ id, name, category });
      saveState();
      showQrCard(id, name, category);

      document.getElementById('form-name').value = '';
      document.getElementById('form-id').value = '';
      renderJamaahList();
    });

    function showQrCard(id, name, category) {
      const box = document.getElementById('qr-preview-box');
      const container = document.getElementById('qrcode-container');
      
      container.innerHTML = '';
      new QRCode(container, {
        text: id,
        width: 160,
        height: 160,
        colorDark: "#047857",
        colorLight: "#ffffff"
      });

      document.getElementById('card-preview-name').textContent = name;
      document.getElementById('card-preview-role').textContent = category;
      document.getElementById('card-preview-id').textContent = 'ID: ' + id;
      box.classList.remove('hidden');
    }

    document.getElementById('btn-close-preview').addEventListener('click', () => {
      document.getElementById('qr-preview-box').classList.add('hidden');
    });

    function renderJamaahList() {
      const container = document.getElementById('jamaah-list');
      document.getElementById('jamaah-count').textContent = jamaahData.length + ' Orang';
      container.innerHTML = '';

      if (jamaahData.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 py-3 text-center">Belum ada jamaah.</p>';
        return;
      }

      jamaahData.forEach(j => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between p-2.5 bg-slate-900 rounded-xl border border-slate-700/60 text-xs';
        div.innerHTML = `
          <div>
            <p class="font-bold text-slate-200">${j.name}</p>
            <p class="text-slate-400 font-mono text-[11px]">${j.id} • ${j.category}</p>
          </div>
          <button onclick="showQrCard('${j.id}', '${j.name}', '${j.category}')" class="px-2 py-1 bg-emerald-950 text-emerald-400 border border-emerald-700 rounded-lg text-[11px]">
            QR
          </button>
        `;
        container.appendChild(div);
      });
    }

    function renderLogs() {
      const container = document.getElementById('log-list');
      container.innerHTML = '';

      if (logsData.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 py-4 text-center">Belum ada riwayat absensi.</p>';
        return;
      }

      logsData.forEach(log => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between p-2.5 bg-slate-900 rounded-xl border border-slate-700/60 text-xs';
        div.innerHTML = `
          <div>
            <p class="font-bold text-slate-200">${log.name}</p>
            <p class="text-slate-400 text-[11px]">${log.prayer} • ${log.date} ${log.time}</p>
          </div>
          <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-950 text-emerald-300 border border-emerald-700">
            ${log.status}
          </span>
        `;
        container.appendChild(div);
      });
    }

    function renderStats() {
      const todayStr = new Date().toISOString().split('T')[0];
      const todayLogs = logsData.filter(l => l.date === todayStr);
      document.getElementById('today-count').textContent = todayLogs.length;
      document.getElementById('ontime-count').textContent = todayLogs.filter(l => l.status === 'Tepat Waktu').length;
    }

    document.getElementById('btn-export-csv').addEventListener('click', () => {
      if (logsData.length === 0) {
        alert('Tidak ada data presensi untuk diunduh.');
        return;
      }

      let csv = 'ID Log,ID Jamaah,Nama,Kategori,Sholat,Tanggal,Waktu,Status\n';
      logsData.forEach(r => {
        csv += `"${r.id}","${r.jamaahId}","${r.name}","${r.category}","${r.prayer}","${r.date}","${r.time}","${r.status}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', `rekap_presensi_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    renderJamaahList();
    renderLogs();
    renderStats();
  </script>
</body>
</html>
